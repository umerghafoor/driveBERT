# Custom Action Recognition Training Configuration
# Template for training action recognition on custom datasets

# General  
finetune: False  # Set to True to finetune from pretrained MotionBERT
partial_train: null  # null or list of layers to freeze

# Training Parameters
epochs: 300  # Number of training epochs
batch_size: 32  # Batch size (adjust based on GPU memory)
lr_backbone: 0.0001  # Learning rate for backbone
lr_head: 0.0001  # Learning rate for classification head
weight_decay: 0.01  # Weight decay for regularization
lr_decay: 0.99  # Learning rate decay factor per epoch

# Model Architecture
model_version: class  # 'class' for classification, 'embed' for embeddings
maxlen: 243  # Maximum sequence length (frames)
dim_feat: 512  # Feature dimension
mlp_ratio: 2  # MLP expansion ratio
depth: 5  # Transformer depth
dim_rep: 512  # Representation dimension
num_heads: 8  # Number of attention heads
att_fuse: True  # Whether to use attention fusion
num_joints: 17  # Number of joints (H36M format)
hidden_dim: 2048  # Hidden dimension for classification head
dropout_ratio: 0.5  # Dropout ratio

# Dataset Configuration
dataset: custom_dataset  # Name of your dataset (should match pickle file name without .pkl)
data_split: train_val  # Split naming convention
clip_len: 243  # Number of frames per clip
action_classes: 10  # REPLACE WITH YOUR NUMBER OF ACTION CLASSES

# Data Augmentation
random_move: True  # Apply random motion augmentation during training
scale_range_train: [1, 3]  # Scaling range for training [min, max]
scale_range_test: [2, 2]  # Scaling range for testing (usually fixed)
