# DrivenAct Action Recognition Training Configuration
# Optimized for driving behavior recognition with 39 midlevel activities

# General  
finetune: False
partial_train: null

# Training Parameters
epochs: 200
batch_size: 8
lr_backbone: 0.00005
lr_head: 0.0001
weight_decay: 0.01
lr_decay: 0.98

# Model Architecture
model_version: class
maxlen: 90
dim_feat: 512
mlp_ratio: 2
depth: 5
dim_rep: 512
num_heads: 8
att_fuse: True
num_joints: 17
hidden_dim: 2048
dropout_ratio: 0.3

# Dataset Configuration
dataset: drivenact_inner_mirror_midlevel_split0
data_split: drivenact
clip_len: 90
action_classes: 39

# Data Augmentation (Conservative for driving activities)
random_move: True
scale_range_train: [1, 1.5]
scale_range_test: [1, 1]

# DrivenAct specific settings
camera_view: inner_mirror
annotation_level: midlevel
