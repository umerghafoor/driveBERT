# DrivenAct Action Recognition Training Configuration
# Optimized for driving behavior recognition with 39 midlevel activities

# General  
finetune: False  # Set to True to finetune from pretrained MotionBERT
partial_train: null  # null or list of layers to freeze

# Training Parameters
epochs: 200  # Reduced from 300 as DrivenAct is pre-segmented
batch_size: 16  # Smaller batch size for detailed driving activities
lr_backbone: 0.00005  # Lower learning rate for fine-grained activities
lr_head: 0.0001  # Standard learning rate for classification head
weight_decay: 0.01  # Weight decay for regularization
lr_decay: 0.98  # Slightly more aggressive decay

# Model Architecture
model_version: class  # Classification mode
maxlen: 90  # DrivenAct uses 90-frame clips (3 seconds at 30fps)
dim_feat: 512  # Feature dimension
mlp_ratio: 2  # MLP expansion ratio
depth: 5  # Transformer depth
dim_rep: 512  # Representation dimension
num_heads: 8  # Number of attention heads
att_fuse: True  # Attention fusion
num_joints: 17  # H36M format joints
hidden_dim: 2048  # Hidden dimension for classification head
dropout_ratio: 0.3  # Lower dropout for fine-grained activities

# Dataset Configuration
dataset: drivenact_inner_mirror_midlevel_split0  # Dataset name
data_split: train_val  # Split naming convention (train_val_test)
clip_len: 90  # Number of frames per clip (3 seconds at 30fps)
action_classes: 35  # Number of activities in DrivenAct (updated from actual data)

# Data Augmentation (Conservative for driving activities)
random_move: True  # Apply random motion augmentation
scale_range_train: [1, 1.5]  # Conservative scaling for driving context
scale_range_test: [1, 1]  # No scaling for testing

# DrivenAct specific settings
camera_view: inner_mirror  # Camera view used
annotation_level: midlevel  # midlevel, objectlevel, or tasklevel
